name: Host unit tests

# Run the host-buildable engine C++/C unit tests in CI (issue #89). These need only
# a host toolchain + system SDL2 (the pixconv oracle) — no armhf cross-build, no
# MiSTer device — so they gate on every change to the MiSTer engine sources. Covers:
#   - build_test_drawcache.sh  : DRAWCACHE cache-invalidation differential (#89)
#   - build_test_fatfilter.sh  : fat-AABB Lua-query precise re-filter (#105)
#   - build_test_alloc_leak.sh : blt_alloc free-list saturation accounting (#109)
#   - build_test_pixconv.sh    : mpix RGB565/ARGB4444 bit-exactness vs SDL
# Before this, these ran only on the author's laptop.

on:
  push:
    paths:
      - 'patches/mister/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'patches/mister/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # libsdl2-dev provides the sdl2 pkg-config module the pixconv oracle links
      # against; pkg-config drives the -cflags/-libs the test scripts query.
      - name: Install SDL2 + pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Build + run host unit tests
        run: bash patches/mister/build_host_tests.sh
