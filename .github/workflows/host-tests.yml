name: Host unit tests

# Run the host-buildable engine C++/C unit tests in CI (issue #89). These need only
# a host toolchain + system SDL2 (the pixconv oracle) — no armhf cross-build, no
# MiSTer device — so they gate on every change to the MiSTer engine sources. Covers:
#   - build_test_drawcache.sh  : DRAWCACHE cache-invalidation differential (#89)
#   - build_test_fatfilter.sh  : fat-AABB Lua-query precise re-filter (#105)
#   - build_test_alloc_leak.sh : blt_alloc free-list saturation accounting (#109)
#   - build_test_pixconv.sh    : mpix RGB565/ARGB4444 bit-exactness vs SDL
# Before this, these ran only on the author's laptop.
#
# Also runs the release-testing recipe's own offline host tests
# (tests/release_manifest_test.sh, tests/release_test_test.sh) — pure/no
# network, no device, no `gh` — so a change to scripts/lib/release_check.sh,
# scripts/release_test.sh, .github/workflows/build-info.sh, or tests/** is
# actually gated instead of only being caught the next time someone
# remembers to run `bash tests/run_tests.sh` by hand.

on:
  push:
    paths:
      - 'patches/mister/**'
      - 'scripts/lib/**'
      - 'scripts/release_test.sh'
      - 'games/Solarus/**'
      - 'tests/**'
      - '.github/workflows/build-info.sh'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'patches/mister/**'
      - 'scripts/lib/**'
      - 'scripts/release_test.sh'
      - 'games/Solarus/**'
      - 'tests/**'
      - '.github/workflows/build-info.sh'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # libsdl2-dev provides the sdl2 pkg-config module the pixconv oracle links
      # against; pkg-config drives the -cflags/-libs the test scripts query.
      - name: Install SDL2 + pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config

      - name: Build + run host unit tests
        run: bash patches/mister/build_host_tests.sh

      - name: Release-testing recipe host tests (offline, no device/gh)
        run: |
          sh tests/release_manifest_test.sh
          sh tests/release_test_test.sh

      # This job runs build_host_tests.sh plus named shell tests, NOT
      # tests/run_tests.sh — so a test added only to run_tests.sh never gates a
      # PR. engine_select_test.sh covers the on-device launcher's engine
      # selector, which has no other CI coverage at all (the 2.x line's build job
      # compiles the engine but never runs solarus_run.sh).
      - name: Launcher engine-selector test (Solarus 2.x test option)
        run: sh tests/engine_select_test.sh
