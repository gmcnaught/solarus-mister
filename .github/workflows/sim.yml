name: HDL unit sims

# Builds + runs every fpga/sim testbench under Icarus Verilog and GATES on the
# self-checking ones (a broken testbench fails the run). Pure verification —
# independent of build-rbf.yml, which deliberately excludes fpga/sim/** from its
# trigger, so this and the RBF build never contend.
#
# All policy (which TBs gate, which are slow/non-gating, the tb_profile
# benchmark that is skipped, per-TB pass markers and timeouts) lives in
# fpga/sim/run_sims.sh so it stays identical locally and in CI.

on:
  push:
    paths:
      - 'fpga/rtl/**'
      - 'fpga/sim/**'
      - '.github/workflows/sim.yml'
  pull_request:
    paths:
      - 'fpga/rtl/**'
      - 'fpga/sim/**'
  schedule:
    - cron: '0 7 * * *'        # nightly full-geometry safety net (07:00 UTC)
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iverilog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Build + run testbenches
        env:
          # schedule + manual dispatch => full-geometry nightly net; push/PR => fast pr tier
          TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'pr' }}
        run: |
          set -o pipefail            # preserve run_sims.sh exit code through tee
          # Leave one core free (nproc-1, min 1): at full --jobs=nproc on the 4-vCPU
          # runner, whenever 3 heavy TBs (bgplane equivalence + the two XL bakes) run
          # alongside a 4th light TB, that 4th shares a saturated core and its wall-clock
          # balloons past its (often 120s default) budget — a spurious timeout. Capping at
          # nproc-1 keeps a spare core so heavy TBs get a dedicated core and light TBs
          # never starve. Wall-clock is bounded by the single longest TB, not throughput,
          # so this does not lengthen the run in practice.
          JOBS=$(( $(nproc) > 2 ? $(nproc) - 1 : 1 ))
          bash fpga/sim/run_sims.sh --tier="$TIER" --jobs="$JOBS" | tee sim.log

      - name: Summary
        if: always()
        run: |
          { echo '### HDL unit sims (Icarus)'; echo '```'; cat sim.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Verilator leg — the BENCHMARKS Icarus cannot run.
  #
  # tb_profile completes only its FIRST blit under Icarus and then hits its own
  # per-blit await timeout on every subsequent one, so its cyc/px table has been
  # unavailable in CI. Under Verilator the whole bench runs in ~1s. Which TBs are
  # eligible is policy in fpga/sim/run_sims.sh (VERILATOR_OK), same as everything
  # else, so this job stays a thin caller.
  #
  # Separate job, not a step in the Icarus one: it needs a different toolchain and
  # must never be able to delay or fail the correctness gate. Everything in
  # VERILATOR_OK today is a benchmark with no verdict, so this job reports rather
  # than gates — but it is NOT `continue-on-error`, so a benchmark that stops
  # BUILDING or starts failing still turns the leg red instead of rotting silently.
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Build + run Verilator-capable benches
        run: |
          set -o pipefail
          bash fpga/sim/run_sims.sh --sim=verilator | tee vsim.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### HDL benches (Verilator)'
            echo '```'
            # Drop the long "n/a — not Verilator-capable" block; the benches and the
            # profile table are the payload.
            grep -v 'not Verilator-capable' vsim.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
