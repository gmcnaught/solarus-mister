name: ShellCheck

# Static analysis for the project's shell scripts (#93). The launch/quest-lifecycle
# daemons run as root on the busybox-ash device and there is NO runtime fallback —
# a shell bug (a bashism ash can't parse, a bad quote, an argless `kill`) bricks the
# session. Nothing linted these before; this gate does.
#
# Two tiers, by on-device risk:
#   1. STRICT (fails on info+)  — games/Solarus/solarus_start.sh, the on-device
#      engine start. It MUST stay pristine, so every finding (down to style) is a
#      failure. (The launcher, Scripts entries and their helpers are rendered by
#      mister-hybrid-platform and linted there and in host-tests.yml.)
#   2. WARNING (fails on warning+) — scripts/*.sh: host-side build/deploy/test
#      scripts. Real bugs (unquoted word-splitting, argless `kill` = SC2046,
#      bashisms) fail the run; pure-style info suggestions (ls-vs-find, etc.) do
#      not, so the gate stays green without bikeshedding every host script.
#
# Intentional patterns carry inline `# shellcheck disable=...` directives with a
# reason (the busybox `[x]`-grep on ps for pgrep-less process match; env-default
# `ls -t` newest-pick; dynamic `. "$QUEST_LIB"` source).

on:
  push:
    paths:
      - 'games/Solarus/**.sh'
      - 'scripts/**.sh'
      - '.github/workflows/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - 'games/Solarus/**.sh'
      - 'scripts/**.sh'
      - '.github/workflows/*.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Device daemons + launchers (STRICT — fails on any finding)
        run: |
          # The launcher itself is rendered by mister-hybrid-platform (linted in
          # host-tests.yml and in the platform's CI); the hand-written part is the
          # per-quest engine start (bash, shebang-detected).
          shellcheck games/Solarus/solarus_start.sh

      - name: Host build/deploy/test scripts (fails on warning+)
        run: |
          # All tracked scripts/*.sh (recursive: git's pathspec '*' crosses '/'),
          # plus .github/workflows/build-info.sh — a host-side shell script that
          # lives outside scripts/ but is exercised the same way (host build/CI
          # tooling, tests/release_manifest_test.sh). Shebang selects the
          # dialect (fps_monitor.sh is #!/bin/sh, rest bash).
          git ls-files 'scripts/*.sh' '.github/workflows/*.sh' | xargs shellcheck --severity=warning
