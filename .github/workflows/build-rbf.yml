name: Build Solarus RBF

# Compiles the branded Solarus MiSTer FPGA core (fpga/Solarus.qpf) into an RBF.
# Both jobs run the SAME fpga/build_solarus.sh, so they emit the SAME
# _Other/Solarus_YYYYMMDD.rbf — the script's quartus_sh locator picks the right
# toolchain per OS (Windows .exe vs the raetro/quartus Docker image).
#
#   - build-windows : self-hosted Windows runner with local Quartus Lite 17.0
#                     (the default — fast/free; used on every push).
#   - build-linux   : ubuntu-latest + raetro/quartus:17.0 Docker image
#                     (fallback if the Windows build fails, or on demand).
#   - build-nas     : self-hosted Linux runner on the TrueNAS box. Quartus is
#                     baked into the runner image (fpga/docker/quartus-runner.df),
#                     so it runs build_solarus.sh directly like the Windows leg.
#                     Also the only leg that can run a SEED SWEEP (seed_trials
#                     input) — see .github/runners/truenas/ and
#                     docs/truenas-quartus-runner.md. Dispatch-only for now.
#
# Orchestration (see the `if:` guards below):
#   push              -> build-windows; build-linux only if it FAILS
#   dispatch=windows  -> build-windows
#   dispatch=linux    -> build-linux
#   dispatch=nas      -> build-nas
#   dispatch=both     -> build-windows + build-linux (parity check; bytes match)

on:
  push:
    paths:
      - 'fpga/**'
      - '!fpga/sim/**'        # sims/scripts/docs don't affect the RBF — skip the ~13min build
      - '!fpga/scripts/**'
      - '!fpga/docs/**'
      - '!fpga/docker/**'     # runner image definition — CI tooling, not RTL
      - '.github/workflows/build-rbf.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to build on (push always uses windows)'
        type: choice
        options: [windows, linux, nas, both]
        default: windows
      sdram_phase:
        # The PLL only accepts QUANTIZED phase taps (~105.8 ps each, the VCO
        # tap granularity); a non-tap value (e.g. 8000) fails the fitter with
        # "phase_shift set to an illegal value". Use a multiple of ~105.8 ps
        # (e.g. 2540=24x, 5079=48x, 8042=76x). NOTE: must be non-zero, else
        # outclk_3 merges into outclk_0 and SDRAM_CLK goes unconstrained (#44).
        description: 'SDRAM_CLK phase shift in ps (blank = committed value; must be a ~105.8ps multiple, non-zero)'
        type: string
        default: ''
      seed:
        description: 'Fitter SEED override (blank = use committed Solarus.qsf value)'
        type: string
        default: ''
      seed_trials:
        # NAS leg only. Runs fpga/scripts/seed_sweep.sh instead of a single
        # compile: first trial uses the committed seed, then random seeds until
        # one closes timing or the budget runs out, keeping the best RBF.
        # Blank or 1 = ordinary single build. Ignored by the windows/linux legs.
        description: 'NAS only: number of fitter seeds to try (blank/1 = single build)'
        type: string
        default: ''

# Key the concurrency group on the SDRAM phase + seed too (#34 sweeps) so sweep
# dispatches do NOT cancel each other — each combo is its own group. Push builds
# (empty inputs) still collapse to one group and cancel redundant runs.
concurrency:
  group: build-rbf-${{ github.ref }}-${{ github.event.inputs.sdram_phase }}-${{ github.event.inputs.seed }}
  cancel-in-progress: true

jobs:
  build-windows:
    # Push always builds here; dispatch builds here for windows|both.
    if: ${{ github.event_name == 'push'
            || github.event.inputs.runner == 'windows'
            || github.event.inputs.runner == 'both' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash — runs build_solarus.sh and resolves the /c/intelFPGA_lite/...
        # MSYS path its quartus_sh locator falls back to.
        # Explicit git-bash path (self-hosted runner doesn't have it in PATH,
        # so `shell: bash` can't auto-resolve it). Mirrors GitHub's bash flags.
        # Use the 8.3 SHORT name (PROGRA~1) — GitHub splits the custom-shell
        # string on the FIRST space to find the executable, so a real space in
        # "Program Files" mangles the path (quotes don't protect it).
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4
        # Default clean:true (git clean -ffdx) wipes leftover Quartus output
        # (db/, output_files/, build_*.log) so we never ship a stale RBF.

      - name: Override SDRAM phase (#34 sweep)
        if: ${{ github.event.inputs.sdram_phase != '' }}
        run: |
          sed -i 's/\.phase_shift3("[^"]*")/.phase_shift3("${{ github.event.inputs.sdram_phase }} ps")/' fpga/rtl/pll/pll_0002.v
          grep phase_shift3 fpga/rtl/pll/pll_0002.v

      - name: Override fitter SEED (#34 sweep)
        if: ${{ github.event.inputs.seed != '' }}
        run: |
          sed -i 's/-name SEED [0-9]*/-name SEED ${{ github.event.inputs.seed }}/' fpga/Solarus.qsf
          grep "name SEED" fpga/Solarus.qsf

      - name: Compile RBF (local Quartus Lite 17.0)
        run: |
          cd fpga
          bash build_solarus.sh ../_Other

      - name: Upload Quartus reports
        # always() — these are most valuable when the build FAILS (fit/timing).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/build_*.log
            fpga/sta_*.log
          if-no-files-found: warn

      - name: Show result
        run: ls -lh _Other/Solarus_*.rbf

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarus-rbf
          path: _Other/Solarus_*.rbf
          if-no-files-found: error

  build-linux:
    needs: [build-windows]
    # Runs when explicitly chosen (linux|both) OR as a fallback if the Windows
    # build failed. always() lets this evaluate even when build-windows was
    # skipped (dispatch=linux) — otherwise a skipped need would cascade-skip us.
    if: ${{ always()
            && ( github.event.inputs.runner == 'linux'
                 || github.event.inputs.runner == 'both'
                 || needs.build-windows.result == 'failure' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Mirror the build-windows overrides — the docker step mounts $PWD into the
      # image, so these host-side seds reach the build. Without them the Linux
      # fallback silently builds the committed phase (phase_shift3=0), which
      # merges outclk_3 into outclk_0 and leaves SDRAM_CLK unconstrained (#44).
      - name: Override SDRAM phase (#34 sweep)
        if: ${{ github.event.inputs.sdram_phase != '' }}
        run: |
          sed -i 's/\.phase_shift3("[^"]*")/.phase_shift3("${{ github.event.inputs.sdram_phase }} ps")/' fpga/rtl/pll/pll_0002.v
          grep phase_shift3 fpga/rtl/pll/pll_0002.v

      - name: Override fitter SEED (#34 sweep)
        if: ${{ github.event.inputs.seed != '' }}
        run: |
          sed -i 's/-name SEED [0-9]*/-name SEED ${{ github.event.inputs.seed }}/' fpga/Solarus.qsf
          grep "name SEED" fpga/Solarus.qsf

      - name: Free disk space (Quartus needs ~24 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Compile RBF (Quartus Lite 17.0 in Docker)
        run: |
          # Use the image's own entrypoint (sets Quartus PATH via ENV); a
          # non-login `bash -c` keeps that PATH (a login shell would reset it
          # from /etc/profile and lose /opt/intelFPGA/quartus/bin).
          docker run --rm -v "$PWD:/build" raetro/quartus:17.0 \
            bash -c "cd /build/fpga && bash build_solarus.sh ../_Other"

      - name: Upload Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports-linux
          path: |
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/build_*.log
            fpga/sta_*.log
          if-no-files-found: warn

      - name: Show result
        run: ls -lh _Other/Solarus_*.rbf

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarus-rbf-linux
          path: _Other/Solarus_*.rbf
          if-no-files-found: error

  build-nas:
    # Dispatch-only while the NAS runner is being proven out. Once it has
    # produced an RBF that matches the Windows leg, this can take over the
    # push trigger (and build-linux can go back to being a pure fallback).
    if: ${{ github.event.inputs.runner == 'nas' }}
    # `quartus` is set via LABELS in .github/runners/truenas/quartus-runner.compose.yaml.
    runs-on: [self-hosted, linux, quartus]
    # Generous vs. the 120 the hosted legs use: Quartus fitting is dominated by
    # single-thread performance, and a NAS CPU is typically well short of the
    # Windows build box. Tighten once a real build time is known.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        # clean:true (git clean -ffdx) wipes the previous run's Quartus output.
        # This only works because the runner container runs as root — the
        # Quartus container writes db/ and output_files/ back as root.

      # Same overrides as the other two legs; the docker step below mounts $PWD
      # into the image, so host-side seds reach the build.
      - name: Override SDRAM phase (#34 sweep)
        if: ${{ github.event.inputs.sdram_phase != '' }}
        run: |
          sed -i 's/\.phase_shift3("[^"]*")/.phase_shift3("${{ github.event.inputs.sdram_phase }} ps")/' fpga/rtl/pll/pll_0002.v
          grep phase_shift3 fpga/rtl/pll/pll_0002.v

      - name: Override fitter SEED (#34 sweep)
        if: ${{ github.event.inputs.seed != '' }}
        run: |
          sed -i 's/-name SEED [0-9]*/-name SEED ${{ github.event.inputs.seed }}/' fpga/Solarus.qsf
          grep "name SEED" fpga/Solarus.qsf

      # NOTE: no free-disk-space step here — that action is for the bloated
      # GitHub-hosted images and would be actively wrong on the NAS. Provision
      # the dataset with headroom instead (see docs/truenas-quartus-runner.md).

      # Quartus lives IN the runner image (fpga/docker/quartus-runner.df), so
      # this is the same two lines the Windows leg runs — no docker socket, no
      # nested container, no workspace path aliasing.
      - name: Compile RBF (single seed)
        if: ${{ github.event.inputs.seed_trials == '' || github.event.inputs.seed_trials == '1' }}
        run: |
          cd fpga
          bash build_solarus.sh ../_Other

      # Seed sweep, modeled on jotego's `jtutil seed --max-trials 4`. Starts
      # from the committed seed, tries random ones only if that fails timing,
      # keeps the best RBF seen. This is the reason to own the hardware: it is
      # N full compiles of pure CPU time.
      - name: Compile RBF (seed sweep)
        if: ${{ github.event.inputs.seed_trials != '' && github.event.inputs.seed_trials != '1' }}
        run: |
          fpga/scripts/seed_sweep.sh -n "${{ github.event.inputs.seed_trials }}" -o _Other

      - name: Upload seed-sweep logs
        if: ${{ always() && github.event.inputs.seed_trials != '' && github.event.inputs.seed_trials != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: seed-sweep-logs
          path: fpga/seed_sweep/*/console.log
          if-no-files-found: warn

      - name: Upload Quartus reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports-nas
          path: |
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
            fpga/build_*.log
            fpga/sta_*.log
          if-no-files-found: warn

      - name: Show result
        run: ls -lh _Other/Solarus_*.rbf

      - name: Upload RBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarus-rbf-nas
          path: _Other/Solarus_*.rbf
          if-no-files-found: error
